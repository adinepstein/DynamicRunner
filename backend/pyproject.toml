[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicrunner"
version = "0.1.0"
description = "DynamicRunner FastAPI service and domain models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "structlog>=24.4",
  "PyJWT[crypto]>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "garth>=0.5.0",
  "curl_cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator[http,ruff]>=0.25",
  "pytest>=8",
  "jsonschema>=4",
  "ruff>=0.6",
  "mypy>=1.13",
  "cryptography>=43",
]

[project.scripts]
dynamicrunner-api = "dynamicrunner.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dynamicrunner"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dynamicrunner.schema_models.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dynamicrunner.garmin.client"
ignore_errors = true
